<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kıbrıs Sigorta Rehberi</title>
<meta name="robots" content="noindex,follow">
<link rel="canonical" href="https://ORNEK-ALAN-ADI.com/tr/">
<link rel="alternate" hreflang="tr" href="https://ORNEK-ALAN-ADI.com/tr/">
<link rel="alternate" hreflang="en" href="https://ORNEK-ALAN-ADI.com/en/">
<link rel="alternate" hreflang="ru" href="https://ORNEK-ALAN-ADI.com/ru/">
<link rel="alternate" hreflang="fa" href="https://ORNEK-ALAN-ADI.com/fa/">
<link rel="alternate" hreflang="x-default" href="https://ORNEK-ALAN-ADI.com/tr/">
<script>
  /* Tarayıcı diline göre yönlendir; tanımadığımız dillerde Türkçe. */
  (function () {
    var supported = ['tr', 'en', 'ru', 'fa'];
    var langs = navigator.languages || [navigator.language || 'tr'];
    var pick = 'tr';
    for (var i = 0; i < langs.length; i++) {
      var code = String(langs[i]).slice(0, 2).toLowerCase();
      if (supported.indexOf(code) > -1) { pick = code; break; }
    }
    location.replace('/' + pick + '/');
  })();
</script>
<meta http-equiv="refresh" content="0; url=/tr/">
</head>
<body style="font-family:system-ui;padding:2rem">
  <p>Yönlendiriliyorsunuz…</p>

    <li><a href="/tr/">Türkçe</a></li>
    <li><a href="/en/">English</a></li>
    <li><a href="/ru/">Русский</a></li>
    <li><a href="/fa/">فارسی</a></li>
  </ul>
</body>
</html>
